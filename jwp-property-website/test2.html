<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Snap with JS</title>
<style>
  .scroll-container {
    width: 100%;
    height: 100vh; /* Full viewport height */
    overflow-y: scroll;
    scroll-snap-type: y mandatory; /* 强制垂直滚动 */
    scroll-behavior: smooth; /* 平滑滚动 */
  }
  .scroll-section {
    width: 100%;
    height: 100vh; /* Full viewport height */
    scroll-snap-align: start; /* 对齐到视图的开始 */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
  }
</style>
</head>
<body>
<div class="scroll-container" id="scrollContainer">
  <div class="scroll-section" style="background-color: #ff7f7f;">Section 1</div>
  <div class="scroll-section" style="background-color: #7f7fff;">Section 2</div>
  <div class="scroll-section" style="background-color: #7fff7f;">Section 3</div>
</div>
<button onclick="scrollToSection(0)">Go to Section 1</button>
<button onclick="scrollToSection(1)">Go to Section 2</button>
<button onclick="scrollToSection(2)">Go to Section 3</button>
<script>
  function scrollToSection(index) {
    const container = document.getElementById('scrollContainer');
    container.scrollTo({top: index * window.innerHeight, behavior: 'smooth'});
  }
</script>
</body>
</html>
